name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: tradeuser
          POSTGRES_PASSWORD: tradepass
          POSTGRES_DB: tradedb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      zookeeper:
        image: confluentinc/cp-zookeeper:7.5.0
        env:
          ZOOKEEPER_CLIENT_PORT: 2181
          ZOOKEEPER_TICK_TIME: 2000
        ports:
          - 2181:2181
      
      kafka:
        image: confluentinc/cp-kafka:7.5.0
        env:
          KAFKA_BROKER_ID: 1
          KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
        ports:
          - 9092:9092
        options: >-
          --health-cmd "kafka-broker-api-versions --bootstrap-server localhost:9092"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Wait for Kafka to be ready
      run: |
        echo "Waiting for Kafka to be ready..."
        timeout 60 bash -c 'until nc -z localhost 9092; do sleep 1; done'
        echo " Kafka is ready"
    
    - name: Run unit tests with coverage
      env:
        DATABASE_URL: postgresql://tradeuser:tradepass@localhost:5432/tradedb
        KAFKA_BOOTSTRAP_SERVERS: localhost:9092
        KAFKA_TOPIC: trades
        TESTING: "1"
      run: |
        pytest tests/ -v --cov=app --cov-report=xml --cov-report=term-missing

    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        fail_ci_if_error: false

  security-scan:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Safety check (Dependency Vulnerability Scan)
      run: |
        pip install safety
        safety check --json --output safety-report.json || true
        safety check --continue-on-error || echo "Vulnerabilities found"
      continue-on-error: true

    - name: Run Bandit (Code Security Scan)
      run: |
        pip install bandit
        bandit -r app/ -f json -o bandit-report.json || true
        bandit -r app/ -ll || echo "Security issues found"
      continue-on-error: true

    - name: Check for critical vulnerabilities
      run: |
        pip install safety bandit
        
        # Run safety and check for critical/high severity issues
        echo "Checking for critical dependency vulnerabilities..."
        safety check --bare --json > safety-output.json || true
        
        if [ -f safety-output.json ]; then
          # Check if there are any vulnerabilities
          if grep -q "vulnerabilities" safety-output.json; then
            echo " Vulnerabilities found in dependencies"
            cat safety-output.json
            # Uncomment the next line to fail on ANY vulnerability
            # exit 1
          else
            echo " No critical vulnerabilities found in dependencies"
          fi
        fi
        
        # Run bandit for code security issues
        echo "Checking for code security issues..."
        bandit -r app/ -ll -f json -o bandit-output.json || true
        
        if [ -f bandit-output.json ]; then
          # Count high and medium severity issues
          HIGH_COUNT=$(cat bandit-output.json | python -c "import sys, json; data=json.load(sys.stdin); print(len([x for x in data.get('results', []) if x.get('issue_severity') in ['HIGH', 'CRITICAL']]))" || echo "0")
          
          if [ "$HIGH_COUNT" -gt 0 ]; then
            echo " Found $HIGH_COUNT high/critical security issues"
            cat bandit-output.json
            exit 1
          else
            echo " No critical code security issues found"
          fi
        fi

    - name: Upload security reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-reports
        path: |
          *-report.json
          *-output.json

  lint:
    name: Code Quality Check
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black isort

    - name: Run Black (Code Formatter Check)
      run: |
        black --check app/ tests/ || echo "Code formatting issues found"
      continue-on-error: true

    - name: Run isort (Import Sorting Check)
      run: |
        isort --check-only app/ tests/ || echo "Import sorting issues found"
      continue-on-error: true

    - name: Run Flake8 (Linting)
      run: |
        flake8 app/ tests/ --max-line-length=120 --exclude=__pycache__ || echo "Linting issues found"
      continue-on-error: true

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [test, security-scan, lint]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@ with docker-compose
      run: |
        # Use docker-compose for full stack testing
        docker-compose up -d
        
        echo "Waiting for services to be healthy..."
        sleep 20
        
        # Health check API
        echo "Testing API health endpoint..."
        curl -f http://localhost:8000/ || exit 1
        
        # Check if Kafka is accessible
        echo "Checking Kafka availability..."
        docker-compose ps
        
        echo " All services are running"
        
        # Cleanup
        docker-compose down -v
        docker build -t trade-store-api:latest .

    - name: Test Docker image
      run: |
        docker run -d --name test-container -p 8000:8000 -e DATABASE_URL=sqlite:///./test.db trade-store-api:latest
        sleep 10
        curl -f http://localhost:8000/ || exit 1
        docker stop test-container
        docker rm test-container

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Deploy to Production
      run: |
        echo "🚀 Deployment step - Configure your deployment here"
        echo "This could deploy to AWS, Azure, GCP, Heroku, etc."
        # Add your deployment commands here
